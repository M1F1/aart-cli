name: AART release checklist
description: >
  Reconcile against the reference registry, prove the tag, build the offline wheel and ship it.
  Lives in an action for the same reason the quality gates do: two jobs differ only in how their
  container image is pulled, and a release checklist duplicated is a release checklist that drifts.

inputs:
  python:
    description: Name of the interpreter to invoke.
    required: true
  tag:
    description: The release tag under inspection.
    required: true
  attach:
    description: >
      '"true" when the wheel should be attached to the release.  Not read off the event: the
      release button publishes the release itself and then calls this action directly, because a
      release created with the repository GITHUB_TOKEN raises no event for anything to react to.'
    required: true

runs:
  using: composite
  steps:
    # The release steps read history through git, so they need the same trust the quality action
    # establishes.  See the note there.
    - name: Trust the checked-out workspace
      shell: bash
      # `$PWD`, not `$GITHUB_WORKSPACE`: a composite step starts in the repository root
      # anyway, and the shell guarantees `$PWD` is set to it.  An unset environment
      # variable would expand to an empty path, which git accepts and which fixes
      # nothing -- a silent no-op is the worst outcome for a step like this.
      run: git config --global --add safe.directory "$PWD"

    - name: Point pip at the internal index
      uses: ./.github/actions/pip-index

    # The wheel build runs the Poetry CLI, and a clean runner has none. The quality action
    # installs the same locked tools before its gates; without them here the first release run
    # failed `release-package-invalid` after the tag and the GitHub Release already existed.
    - name: Install the locked build tools
      shell: bash
      run: ${{ inputs.python }} scripts/dev_tools.py install

    # Unset means this fork keeps no artifact catalogue, so there is nothing to reconcile against
    # and nothing to clone.  The variable is the switch; there is no second one to remember.
    - name: Clone approved reference registry
      if: env.REFERENCE_REGISTRY_URL != ''
      shell: bash
      run: git clone --depth 1 "$REFERENCE_REGISTRY_URL" "$RUNNER_TEMP/reference-registry"

    - name: Prove the tagged source was merged into main
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
        git merge-base --is-ancestor "$TAG_COMMIT" origin/main

    # `--without-registry` is typed out rather than inferred from a missing `--registry`, so a
    # release that verifies less can only happen on purpose.  The checklist warns on every such
    # run and marks the seven registry checks `skipped`, never `passed`.
    - name: Run stable release checklist
      shell: bash
      run: |
        set -euo pipefail
        if [ -n "${REFERENCE_REGISTRY_URL:-}" ]; then
          ${{ inputs.python }} scripts/release.py check --registry "$RUNNER_TEMP/reference-registry"
        else
          ${{ inputs.python }} scripts/release.py check --without-registry
        fi

    # No source-version-versus-tag step and no reviewed-notes file: the release engine writes the
    # version and the release body, and what is worth proving at a tag is a property of the
    # artifact -- which is what the two steps after the build do.  See INV-097, INV-098, INV-101.

    # The one quality gate the release run keeps.  Its subject is the wheel, not the source, so
    # the pull request that proved the source cannot have proven it: it builds a wheel in a
    # throwaway copy of the tree and imports the package back out of it.  Everything else the ten
    # gates check was already proven on the way to `main`.
    # See docs/ci/workflows-v1.md.
    - name: Check the packaged wheel
      shell: bash
      run: ${{ inputs.python }} scripts/packaging_check.py

    - name: Inject commit
      shell: bash
      run: ${{ inputs.python }} scripts/inject_commit.py

    # Unset means this fork bakes no default Registry, which is the public build's state and is
    # not an error -- the same switch `REFERENCE_REGISTRY_URL` is, for the reason D-309 gives.
    # Set, it is `<alias>=<url>`, and a malformed value fails here rather than on somebody's first
    # run, which is the one run with no configuration to fall back on.  See D-373.
    - name: Inject default registry
      shell: bash
      run: ${{ inputs.python }} scripts/inject_default_registry.py

    # Unset or `none` means this fork's wheel records artifact usage nowhere until a person turns it
    # on in Settings, which is the public build's state.  Set, it is harness names separated by
    # commas, such as `opencode`, and a name that cannot record fails here.  See D-502.
    - name: Inject default usage harnesses
      shell: bash
      run: ${{ inputs.python }} scripts/inject_default_usage.py

    # Unset means this fork's wheel offers no telemetry server, which is the public build's state.
    # Set, it is the server's base address, `https://` or loopback `http://`, and an address aart-cli
    # would refuse fails here.  Offering is all it does: telemetry stays off until a person turns it
    # on.  See D-503.
    - name: Inject default telemetry server
      shell: bash
      run: ${{ inputs.python }} scripts/inject_default_telemetry.py

    # Unset means this fork's wheel carries the tag's version, as the public one does.  Set, it is a
    # PEP 440 local label such as `corp`, and the wheel becomes `X.Y.Z+corp`: a filename of its own
    # beside the public wheel on PyPI, which `aart-cli==X.Y.Z` still matches and pip prefers.  Only
    # the distribution's version moves; `aart-cli --version` still says the tag.  See D-476.
    - name: Inject local version label
      shell: bash
      run: ${{ inputs.python }} scripts/inject_local_version.py

    - name: Build wheel
      shell: bash
      run: ${{ inputs.python }} scripts/build_wheel.py

    # The subject of a release run.  The tag is the released identity, so the archive about to be
    # published has to agree with it -- in its filename, in its metadata, and in what the command
    # inside it says when a clean environment runs it.  None of this was provable on the pull
    # request: the wheel did not exist.  See scripts/release_artifact.py.
    - name: Verify the artifact against the tag it is published under
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: ${{ inputs.python }} scripts/release_artifact.py --tag "$TAG"

    # Neither the GitHub CLI nor curl is installed in every CI image.  A real Enterprise image had
    # git, an internal index and a Python interpreter, and nothing else -- this step failed first on
    # `gh: command not found` and then, rewritten around the REST API, on `curl: command not found`,
    # both times after the wheel was already built.  So it now asks for nothing the release does not
    # already need, the same way GNU Make came off the list earlier.
    #
    # The script also removes a hazard `gh` brought with it: `gh` talks to github.com unless
    # `GH_HOST` says otherwise, so an unset `AART_CLI_GH_HOST` pointed a fork's upload at the wrong
    # instance entirely.  See scripts/attach_release_asset.py for what is read rather than guessed.
    # Asked for by the caller rather than read off `github.event_name`.  The release button
    # publishes the release with the repository `GITHUB_TOKEN`, and GitHub deliberately raises no
    # workflow event for anything done with that token -- so the run that publishes a release is
    # the last run there will be, and it has to finish the job itself.
    - name: Attach wheel to release
      if: inputs.attach == 'true'
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: ${{ inputs.python }} scripts/attach_release_asset.py "$TAG"

    # The upload to an internal index is not here.  `release.yml` calls `publish-index.yml` once
    # this run has attached the wheel, so an index that refuses no longer turns the release red,
    # and a tag can be published again by hand (§192, INV-293).

    # There is no workflow-artifact copy of the wheel, and the reason is worth keeping.
    #
    # A GitHub Enterprise Server instance ships `upload-artifact@v4`, downloads it happily and then
    # fails at run time:
    #
    #     GHESNotSupportedError: @actions/artifact v2.0.0+, upload-artifact@v4+ and
    #     download-artifact@v4+ are not currently supported on GHES.
    #
    # github.com refuses `upload-artifact@v3` while *resolving* the action, before any `if:` is
    # evaluated, so merely naming v3 in a file fails a run. One host cannot use v4, the other cannot
    # name v3, and a single file cannot satisfy both.
    #
    # It does not need to. The wheel is attached to the release above, which is where anyone
    # installing it looks; an artifact would be a second copy of the same bytes with a shorter life.
    # A run on a tag with no release still builds the wheel and so still proves it builds.
