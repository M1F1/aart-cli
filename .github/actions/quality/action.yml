name: AART quality gates
description: >
  Install the developer tools and run the canonical gates.  Lives in an action rather than in the
  workflow because the same steps run from two jobs that differ only in how their container image
  is pulled, and one copy of a gate list is the only copy worth trusting.

inputs:
  python:
    description: Name of the interpreter to invoke.
    required: true
  gates:
    description: >
      Space-separated gate names to run, or empty for the canonical full run.  A release pull
      request narrows this to the gates that can prove what it changes (INV-096); everything else
      leaves it empty and gets every gate.
    required: false
    default: ""
  scope-base:
    description: >
      The base the pull request is measured against.  Set only by a release pull request, and
      setting it is what turns the scope check on: a narrowed gate list is safe only while the diff
      is release bookkeeping and nothing else (D-290).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # `actions/checkout` writes the workspace as the runner's uid; a container job usually runs as
    # a different one, and git then refuses every command in it with `detected dubious ownership`.
    # It is a container fact, not a repository fault, so the fix belongs here rather than in an
    # image every fork would have to rebuild.  Marking one known path costs nothing and leaves
    # git's protection in place everywhere else.
    - name: Trust the checked-out workspace
      shell: bash
      # `$PWD`, not `$GITHUB_WORKSPACE`: a composite step starts in the repository root
      # anyway, and the shell guarantees `$PWD` is set to it.  An unset environment
      # variable would expand to an empty path, which git accepts and which fixes
      # nothing -- a silent no-op is the worst outcome for a step like this.
      run: git config --global --add safe.directory "$PWD"

    # A release pull request is gated on what it changes rather than on everything (INV-096), and
    # this is the half that makes that safe.  The branch name the job keys on is not evidence --
    # anyone who can push can push to `release-please--…` -- so the diff is read and anything
    # outside release bookkeeping refuses the narrow path.  It runs before the tools are installed
    # because a pull request that fails it has nothing to gain from a working interpreter.
    - name: Refuse the narrow release gate to anything but release bookkeeping
      if: inputs.scope-base != ''
      shell: bash
      env:
        BASE: ${{ inputs.scope-base }}
      run: ${{ inputs.python }} scripts/release_pr_scope.py --base "$BASE"

    - name: Point pip at the internal index
      uses: ./.github/actions/pip-index

    # Poetry decides *what* the tools are -- semantic-version ranges in pyproject.toml, resolved
    # to exact versions in poetry.lock -- and pip installs them.  The split is forced, not
    # stylistic: Poetry takes an install source only from a `[[tool.poetry.source]]` block inside
    # pyproject.toml, adding that block at run time changes the file's hash, and `poetry install`
    # then refuses the lock outright.  Committing the block would turn the internal index's URL into a
    # hand-edit in every fork.  pip reads `PIP_INDEX_URL`, which the step above just set.
    # scripts/dev_tools.py carries the lock's pins across.
    - name: Install developer quality tools
      shell: bash
      run: ${{ inputs.python }} scripts/dev_tools.py install

    # `scripts/quality.py` is the canonical gate runner and the Makefile target is a one-line
    # wrapper around it, so calling it directly costs nothing and drops GNU Make from the list of
    # things a CI image has to carry.  The script propagates its own interpreter to every gate
    # (`python: str = sys.executable`).
    #
    # An empty `gates` is the full canonical run: the script takes gate names as positional
    # arguments and runs everything when given none, so the ordinary pull request needs no
    # condition here and cannot accidentally run a subset.
    - name: Run canonical quality gates
      shell: bash
      run: ${{ inputs.python }} scripts/quality.py ${{ inputs.gates }}

    # The pull request's title, checked as what it actually is: the squash commit that will land
    # on `main`, and the input the release engine classifies (INV-090, INV-092).  A title it
    # cannot read does not fail loudly later -- it classifies as nothing and the change is left
    # out of the release it belonged in.
    #
    # It lives here rather than in a job of its own because it needs an interpreter and a checked
    # out tree, and this action is where a pull request run already has both, in either container
    # shape.  `github.event_name` guards it: nothing else has a title to check.
    #
    # This validates semantic change metadata.  It is not a version check -- the script does not
    # know what a version is.
    - name: Validate the pull request title
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
      run: ${{ inputs.python }} scripts/conventional_title.py "$PR_TITLE"
