name: release

# Proves what has the release as its subject, builds the offline zero-dependency wheel, and
# ships it.  The ten source gates ran on the pull request; see the note above the job.
# Triggers:
#   * a stable vX.Y.Z tag push          -> build + upload as a workflow artifact
#   * a published GitHub release        -> additionally attach the wheel to the release, then
#                                          call publish-index.yml to upload it to an internal index
# `scripts/release_artifact.py` is the real gate: it rejects any wheel whose filename, metadata or
# installed command disagrees with the tag it is being published under, so the pattern below stays
# deliberately broad rather than pinning one release and silently building nothing for the next.
#
# It is also callable. GitHub raises no workflow event for anything done with the repository
# `GITHUB_TOKEN`, so the tag and release that `release-please.yml` creates set nothing off -- that
# workflow calls this one instead. The two event triggers stay for a tag pushed by a person.
#
# Portable to a GitHub Enterprise Server fork by setting repository variables only.  Every default
# reproduces the public github.com run except one: `AART_CLI_REFERENCE_REGISTRY_URL` has no default,
# because a default naming a github.com repository reproduces nothing on an instance that cannot
# reach it.  See the note on that variable below.  See docs/ci/github-enterprise-rollout.md.
#
# Each job appears twice for the reason pr-check.yml records: a container's `credentials` block
# cannot be conditional, so the condition moves to the job.  Both shapes share their steps through
# `.github/actions/*`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and verify.
        required: true
        type: string
      attach:
        description: Whether the wheel should be attached to the release at that tag.
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # required to attach assets to the release

# Poetry builds the wheel and installs the developer tooling.  An image that keeps Poetry off
# `PATH` -- `/opt/poetry/bin/poetry` is the common shape -- names it in this variable instead;
# unset, every step falls back to plain `poetry`.  See docs/ci/github-enterprise-rollout.md.
env:
  AART_CLI_POETRY: ${{ vars.AART_CLI_POETRY }}

jobs:
  # No quality jobs here.  A release is cut from a commit that reached `main`, and nothing reaches
  # `main` except through a pull request that passed all ten gates on the full interpreter matrix.
  # What this run checks is everything whose subject is the release itself: the tagged commit is in
  # `main`, the release checklist passes, and `packaging-check` -- the one gate whose subject is the
  # wheel rather than the source.
  # See docs/ci/workflows-v1.md.
  release:
    if: vars.AART_CLI_IMAGE_USERNAME_SECRET_NAME == ''
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    container: ${{ vars.AART_CLI_CI_IMAGE || format('python:{0}', vars.AART_CLI_RELEASE_PYTHON_VERSION || '3.11') }}
    env:
      AART_CLI_INDEX_URL: ${{ vars.AART_CLI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      AART_CLI_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_PIP_INDEX_CREDENTIALS_SECRET_NAME] }}
      # The release checklist reconciles against a real registry checkout, and this variable is
      # the switch: set, the reconciliation runs against what it names; unset, it is skipped and
      # says so.  There is deliberately no default.  A default naming this project's registry
      # promised a fork parity it cannot have -- an Enterprise instance cannot reach github.com,
      # so the default guaranteed a failed clone rather than the public behaviour.  Actions cannot
      # tell an unset variable from an empty one, so a default and an opt-out cannot coexist here.
      #
      # This repository therefore sets it explicitly.  Clearing it is a real change: releases keep
      # passing and verify seven checks fewer, which is why the checklist warns on every run that
      # skips and records `registry_reconciliation` in its receipt.
      REFERENCE_REGISTRY_URL: ${{ vars.AART_CLI_REFERENCE_REGISTRY_URL }}
      # `<alias>=<url>` for the one Registry this fork's wheel connects on a first run that has
      # nothing configured (D-373).  Unset bakes nothing; the alias is in the value because it is
      # stamped into the path of everything installed from that Registry (D-359, INV-253).
      AART_CLI_DEFAULT_REGISTRY_ALIAS_AND_URL: ${{ vars.AART_CLI_DEFAULT_REGISTRY_ALIAS_AND_URL }}
      # Harness names separated by commas, such as `opencode`, that record which skills and MCPs
      # are used without asking (§212, D-502).  Unset or `none` records nowhere until turned on.
      AART_CLI_DEFAULT_USAGE_HARNESSES: ${{ vars.AART_CLI_DEFAULT_USAGE_HARNESSES }}
      # The telemetry server this fork's wheel sends to, on from each home's first start where
      # nobody decided (§213, D-503, D-505).  Unset names none and sends nothing.
      AART_CLI_TELEMETRY_ENDPOINT: ${{ vars.AART_CLI_TELEMETRY_ENDPOINT }}
      # Whether that wheel also sends uses of skills and MCPs it did not install, by name, until
      # a person turns it off in Settings (D-508).  Unset sends them; `off` does not.
      AART_CLI_TELEMETRY_UNMANAGED_USES: ${{ vars.AART_CLI_TELEMETRY_UNMANAGED_USES }}
      # A PEP 440 local label, such as `corp`, for this fork's wheel version (D-476).  Unset labels
      # nothing.  Read by the build and by the check of the built wheel.
      AART_CLI_LOCAL_VERSION_LABEL: ${{ vars.AART_CLI_LOCAL_VERSION_LABEL }}
      # No `GH_HOST`: the release action attaches the wheel through the REST API at
      # `GITHUB_API_URL`, which the runner sets to this instance, so there is nothing to set.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty when this run was triggered by an event rather than called, and an empty `ref`
          # is the default one -- which for a tag push is the tag.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/release
        with:
          python: ${{ vars.AART_CLI_PYTHON || 'python' }}
          tag: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          # A tag push builds and keeps the wheel; a published release also attaches it, and so
          # does the release-please run that created the release the event never announced.
          attach: ${{ inputs.attach || github.event_name == 'release' }}

  release-private-image:
    if: vars.AART_CLI_IMAGE_USERNAME_SECRET_NAME != ''
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    container:
      image: ${{ vars.AART_CLI_CI_IMAGE }}
      credentials:
        username: ${{ secrets[vars.AART_CLI_IMAGE_USERNAME_SECRET_NAME] }}
        password: ${{ secrets[vars.AART_CLI_IMAGE_PASSWORD_SECRET_NAME] }}
    env:
      AART_CLI_INDEX_URL: ${{ vars.AART_CLI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      AART_CLI_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_PIP_INDEX_CREDENTIALS_SECRET_NAME] }}
      REFERENCE_REGISTRY_URL: ${{ vars.AART_CLI_REFERENCE_REGISTRY_URL }}
      # `<alias>=<url>` for the one Registry this fork's wheel connects on a first run that has
      # nothing configured (D-373).  Unset bakes nothing; the alias is in the value because it is
      # stamped into the path of everything installed from that Registry (D-359, INV-253).
      AART_CLI_DEFAULT_REGISTRY_ALIAS_AND_URL: ${{ vars.AART_CLI_DEFAULT_REGISTRY_ALIAS_AND_URL }}
      # Harness names separated by commas, such as `opencode`, that record which skills and MCPs
      # are used without asking (§212, D-502).  Unset or `none` records nowhere until turned on.
      AART_CLI_DEFAULT_USAGE_HARNESSES: ${{ vars.AART_CLI_DEFAULT_USAGE_HARNESSES }}
      # The telemetry server this fork's wheel sends to, on from each home's first start where
      # nobody decided (§213, D-503, D-505).  Unset names none and sends nothing.
      AART_CLI_TELEMETRY_ENDPOINT: ${{ vars.AART_CLI_TELEMETRY_ENDPOINT }}
      # Whether that wheel also sends uses of skills and MCPs it did not install, by name, until
      # a person turns it off in Settings (D-508).  Unset sends them; `off` does not.
      AART_CLI_TELEMETRY_UNMANAGED_USES: ${{ vars.AART_CLI_TELEMETRY_UNMANAGED_USES }}
      # A PEP 440 local label, such as `corp`, for this fork's wheel version (D-476).  Unset labels
      # nothing.  Read by the build and by the check of the built wheel.
      AART_CLI_LOCAL_VERSION_LABEL: ${{ vars.AART_CLI_LOCAL_VERSION_LABEL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Empty when this run was triggered by an event rather than called, and an empty `ref`
          # is the default one -- which for a tag push is the tag.
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: ./.github/actions/release
        with:
          python: ${{ vars.AART_CLI_PYTHON || 'python' }}
          tag: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          # A tag push builds and keeps the wheel; a published release also attaches it, and so
          # does the release-please run that created the release the event never announced.
          attach: ${{ inputs.attach || github.event_name == 'release' }}

  # The upload to an internal index runs after whichever shape ran, as its own workflow, so an index
  # that refuses leaves the Release and its wheel green and is retried by tag (§192, INV-293).  It
  # reads the wheel off the Release, so only a run that attached one calls it: a tag push builds a
  # wheel nobody attached.  `always()` because one of the two shapes is always skipped.
  index:
    needs: [release, release-private-image]
    if: >-
      always()
      && (inputs.attach || github.event_name == 'release')
      && (needs.release.result == 'success' || needs.release-private-image.result == 'success')
    uses: ./.github/workflows/publish-index.yml
    permissions:
      contents: read
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
