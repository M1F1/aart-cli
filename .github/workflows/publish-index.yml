name: publish to index

# Uploads the wheel attached to a GitHub Release to the index this fork publishes to (§192,
# INV-293). Unset `AART_CLI_INDEX_PUBLISH_URL` means this fork publishes to no index, and both jobs
# are skipped: the public run never publishes anywhere but the Release.
#
# It is its own workflow, not the last step of the release, for two reasons. An index that refuses
# used to turn a release red although the Release and its wheel already existed. And the upload
# could only happen while a Release was being published, so a tag released before the variables
# were set, or a failed upload, could not be published without deleting and recreating the
# Release. Now `release.yml` calls this once it has attached the wheel, and anyone can run it again
# for any tag:
#
#     gh workflow run publish-index.yml -f tag=vX.Y.Z
#
# Running it again is always safe. The script asks the index first: the same file already listed is
# success, a different file under the same name is refused, and only an unlisted file is uploaded.
#
# The wheel is downloaded from the Release, so nothing is rebuilt and no workflow artifact is
# needed: GitHub Enterprise Server refuses `upload-artifact@v4` at run time.
#
# Each job appears twice for the reason pr-check.yml records: a container's `credentials` block
# cannot be conditional, so the condition moves to the job.  Both shapes share their step through
# `.github/actions/publish-index`.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose attached wheel is published.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose attached wheel to publish, such as v1.2.3.
        required: true
        type: string

permissions:
  contents: read  # reads the Release and downloads its wheel

jobs:
  publish:
    if: vars.AART_CLI_INDEX_PUBLISH_URL != '' && vars.AART_CLI_IMAGE_USERNAME_SECRET_NAME == ''
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    container: ${{ vars.AART_CLI_CI_IMAGE || format('python:{0}', vars.AART_CLI_RELEASE_PYTHON_VERSION || '3.11') }}
    env:
      # The install index, asked whether it already lists the wheel.  The hosted repository a
      # release uploads to is normally read through the group everything installs from.
      AART_CLI_INDEX_URL: ${{ vars.AART_CLI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      AART_CLI_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_PIP_INDEX_CREDENTIALS_SECRET_NAME] }}
      # The URL is a variable because it is not a secret and belongs in plain sight; the credential
      # is named rather than written, so the value lives only in the secret store.
      INDEX_PUBLISH_URL: ${{ vars.AART_CLI_INDEX_PUBLISH_URL }}
      AART_CLI_INDEX_PUBLISH_CREDENTIALS: ${{ secrets[vars.AART_CLI_INDEX_PUBLISH_CREDENTIALS_SECRET_NAME] }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/publish-index
        with:
          python: ${{ vars.AART_CLI_PYTHON || 'python' }}
          tag: ${{ inputs.tag }}

  publish-private-image:
    if: vars.AART_CLI_INDEX_PUBLISH_URL != '' && vars.AART_CLI_IMAGE_USERNAME_SECRET_NAME != ''
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    container:
      image: ${{ vars.AART_CLI_CI_IMAGE }}
      credentials:
        username: ${{ secrets[vars.AART_CLI_IMAGE_USERNAME_SECRET_NAME] }}
        password: ${{ secrets[vars.AART_CLI_IMAGE_PASSWORD_SECRET_NAME] }}
    env:
      AART_CLI_INDEX_URL: ${{ vars.AART_CLI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      AART_CLI_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_PIP_INDEX_CREDENTIALS_SECRET_NAME] }}
      INDEX_PUBLISH_URL: ${{ vars.AART_CLI_INDEX_PUBLISH_URL }}
      AART_CLI_INDEX_PUBLISH_CREDENTIALS: ${{ secrets[vars.AART_CLI_INDEX_PUBLISH_CREDENTIALS_SECRET_NAME] }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/publish-index
        with:
          python: ${{ vars.AART_CLI_PYTHON || 'python' }}
          tag: ${{ inputs.tag }}
