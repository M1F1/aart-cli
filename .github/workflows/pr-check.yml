name: pr-check

# Every quality gate, on every pull request, and nowhere else.
#
# `main` is protected: nothing reaches it except through a pull request.  A pull-request run is
# checked against the *merge* of the branch and its base, so with "require branches to be up to
# date before merging" turned on, the commit this run proves is the commit that lands.  A second
# run after the merge would prove the same tree again, so there is none -- and that is also why
# there is no `on: push`.  A branch pushed without a pull request is checked by nothing, which is
# the intent rather than an oversight.  See docs/ci/workflows-v1.md.
#
# Portable to a GitHub Enterprise Server fork by setting repository variables only.  Every default
# below reproduces the public github.com run exactly, so an unconfigured fork behaves the way this
# repository does.  See docs/ci/github-enterprise-rollout.md for the variable list and for the two
# things a variable cannot express.
#
# The gate job appears twice because a `container.credentials` block cannot be made conditional: an
# empty one and a `null` one are both rejected before the job starts, and a placeholder credential
# makes an anonymous pull fail a `docker login` it never needed.  So the choice is made where a
# choice survives -- `if:` at job level -- and the two jobs share every step through
# `.github/actions/quality`.  Name no credential secrets and the first job is the only one that
# runs, exactly as before.

on:
  pull_request:

permissions:
  contents: read

# Poetry builds the wheel.  An image that keeps Poetry off `PATH` -- `/opt/poetry/bin/poetry` is
# the common shape -- names it in this variable instead; unset, every step falls back to plain
# `poetry`.  See docs/ci/github-enterprise-rollout.md.
env:
  AART_CLI_POETRY: ${{ vars.AART_CLI_POETRY }}

jobs:
  gates:
    if: vars.AART_CLI_IMAGE_USERNAME_SECRET == ''
    name: gates (Python ${{ matrix.python-version }})
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    # Every job takes its interpreter from an image, never from a download: a step-level `if:`
    # decides whether a step runs, not whether its action is fetched, so an instance that does not
    # carry `actions/setup-python` could never have escaped it by configuration.  Unset, the
    # matrix entry names the official image for that interpreter, so the public run still
    # exercises all three.  Set AART_CLI_CI_IMAGE and it replaces all of them -- pin
    # AART_CLI_PYTHON_VERSIONS to one entry then, because one image is one Python.
    container: ${{ vars.AART_CLI_CI_IMAGE || format('python:{0}', matrix.python-version) }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is here because the release run does not run the gates, so this matrix is the only
        # place 3.11 is exercised.
        #
        # A release pull request takes one interpreter instead of three.  Three catch behaviour that
        # differs between interpreters, in code; a release pull request changes no code, only the
        # version literals and the changelog, so the other two would prove the same bookkeeping twice
        # more (INV-096).
        python-version: >-
          ${{ fromJSON(startsWith(github.head_ref, 'release-please--')
          && format('["{0}"]', vars.AART_CLI_RELEASE_PYTHON_VERSION || '3.11')
          || vars.AART_CLI_PYTHON_VERSIONS || '["3.10", "3.11", "3.14"]') }}
    env:
      # The tool's own gates need ruff, mypy and coverage.  That is the one place this repository
      # needs a package index; the registry gates need none.  The variable holds the bare host and
      # names the secret holding `user:pass`, because a variable cannot hold a credential.
      AART_CLI_INDEX_URL: ${{ vars.AART_CLI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      AART_CLI_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_PIP_INDEX_CREDENTIALS_SECRET] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history only where it is needed: the scope check compares the pull request against
          # its base, and a shallow clone has no merge base to compare with.  Quoted, because
          # `x && 0 || 1` in an expression yields 1 either way -- 0 is falsy, so the `||` fires on
          # the branch that was supposed to win.
          fetch-depth: ${{ startsWith(github.head_ref, 'release-please--') && '0' || '1' }}

      - uses: ./.github/actions/quality
        with:
          python: ${{ vars.AART_CLI_PYTHON || 'python' }}
          # Empty is the full canonical run.  A release pull request narrows it to the gates that
          # can prove what it actually changes: the release identity it writes into the tree, the
          # artifact that identity produces, and the documents it rewrites (INV-096).
          gates: >-
            ${{ startsWith(github.head_ref, 'release-please--')
            && 'packaging-check validate docs-check release-bump' || '' }}
          # Setting this turns the scope check on, and the scope check is what makes keying on a
          # branch name safe: the narrow gate list stands only while the diff is release
          # bookkeeping and nothing else (D-290).
          scope-base: >-
            ${{ startsWith(github.head_ref, 'release-please--')
            && github.event.pull_request.base.sha || '' }}

  gates-private-image:
    if: vars.AART_CLI_IMAGE_USERNAME_SECRET != ''
    name: gates (Python ${{ matrix.python-version }}, private image)
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    container:
      image: ${{ vars.AART_CLI_CI_IMAGE }}
      credentials:
        username: ${{ secrets[vars.AART_CLI_IMAGE_USERNAME_SECRET] }}
        password: ${{ secrets[vars.AART_CLI_IMAGE_PASSWORD_SECRET] }}
    strategy:
      fail-fast: false
      matrix:
        python-version: >-
          ${{ fromJSON(startsWith(github.head_ref, 'release-please--')
          && format('["{0}"]', vars.AART_CLI_RELEASE_PYTHON_VERSION || '3.11')
          || vars.AART_CLI_PYTHON_VERSIONS || '["3.10", "3.11", "3.14"]') }}
    env:
      AART_CLI_INDEX_URL: ${{ vars.AART_CLI_PIP_INDEX_URL || 'https://pypi.org/simple' }}
      AART_CLI_INDEX_CREDENTIALS: ${{ secrets[vars.AART_CLI_PIP_INDEX_CREDENTIALS_SECRET] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history only where it is needed: the scope check compares the pull request against
          # its base, and a shallow clone has no merge base to compare with.  Quoted, because
          # `x && 0 || 1` in an expression yields 1 either way -- 0 is falsy, so the `||` fires on
          # the branch that was supposed to win.
          fetch-depth: ${{ startsWith(github.head_ref, 'release-please--') && '0' || '1' }}

      - uses: ./.github/actions/quality
        with:
          python: ${{ vars.AART_CLI_PYTHON || 'python' }}
          # Empty is the full canonical run.  A release pull request narrows it to the gates that
          # can prove what it actually changes: the release identity it writes into the tree, the
          # artifact that identity produces, and the documents it rewrites (INV-096).
          gates: >-
            ${{ startsWith(github.head_ref, 'release-please--')
            && 'packaging-check validate docs-check release-bump' || '' }}
          # Setting this turns the scope check on, and the scope check is what makes keying on a
          # branch name safe: the narrow gate list stands only while the diff is release
          # bookkeeping and nothing else (D-290).
          scope-base: >-
            ${{ startsWith(github.head_ref, 'release-please--')
            && github.event.pull_request.base.sha || '' }}

  # The one name branch protection can require.
  #
  # It cannot require either job above.  Each is a matrix, so its name carries an interpreter
  # version and changes whenever `AART_CLI_PYTHON_VERSIONS` does; and only one of the two arms ever
  # runs, so a rule naming the arm this fork does not use would wait forever.  This job's name is
  # the same on every instance and in every configuration.
  #
  # `if: always()` is what makes it a gate rather than a formality: without it, a skipped or
  # failed dependency would skip this job too, and GitHub counts a skipped required check as
  # satisfied -- so the rule would pass precisely when the gates did not run.
  pr-check:
    if: always()
    name: pr-check
    needs: [gates, gates-private-image]
    runs-on: ${{ fromJSON(vars.AART_CLI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - name: Report the gate results
        shell: bash
        env:
          PLAIN: ${{ needs.gates.result }}
          PRIVATE: ${{ needs.gates-private-image.result }}
        run: |
          set -euo pipefail
          echo "gates:               $PLAIN"
          echo "gates-private-image: $PRIVATE"

          # Exactly one arm is meant to run; the other is skipped by its own `if:`.  Both skipped
          # means the gates never ran at all -- a broken condition, an image variable set to
          # something unexpected -- and that must fail rather than look like a pass.
          if [ "$PLAIN" = "skipped" ] && [ "$PRIVATE" = "skipped" ]; then
            echo "::error::neither gate job ran; check AART_CLI_IMAGE_USERNAME_SECRET" >&2
            exit 1
          fi
          for result in "$PLAIN" "$PRIVATE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a gate job reported '$result'" >&2; exit 1 ;;
            esac
          done
          echo "all gates passed"
