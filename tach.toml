# Module boundaries as data (#32, CP-29, D-404).
#
# Every top-level module of `aart_cli` is a tach module and `depends_on` is the graph the code
# has: `tach sync` wrote it and it was read by hand (D-404).  `domain` is the one layer whose
# target is declared rather than described -- stdlib, itself and the `redaction` leaf only, as
# `tests/architecture_boundary_test.py` has always held.  A new edge anywhere is a diff here that a
# reviewer reads, and `make tach` refuses one that is not.

exclude = ["**/__pycache__", "tests", "scripts", "build", "dist", ".venv"]
source_roots = ["."]
exact = true
forbid_circular_dependencies = true

[[modules]]
path = "aart_cli"
depends_on = []

[[modules]]
path = "aart_cli.__main__"
depends_on = ["aart_cli.cli"]

[[modules]]
path = "aart_cli._commit"
depends_on = []

[[modules]]
path = "aart_cli._default_registry"
depends_on = []

[[modules]]
path = "aart_cli.adapters"
depends_on = []

[[modules]]
path = "aart_cli.application"
depends_on = ["aart_cli.authoring",  "aart_cli.sources", "aart_cli.redaction", "aart_cli.store", "aart_cli.domain", "aart_cli.protocol", "aart_cli.marketplace", "aart_cli.configuration"]

[[modules]]
path = "aart_cli.authoring"
